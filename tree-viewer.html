const cv=document.getElementById('cv'), ctx=cv.getContext('2d'), wrap=document.getElementById('wrap'), tip=document.getElementById('tip');
let cur='lv', scale=1, ox=0, oy=0, dpr=Math.min(2,window.devicePixelRatio||1);
const selSet = k => new Set(DATA.sets[k]);
let SEL=selSet(cur);
function resize(){ cv.width=wrap.clientWidth*dpr; cv.height=wrap.clientHeight*dpr; cv.style.width=wrap.clientWidth+'px'; cv.style.height=wrap.clientHeight+'px'; draw(); }
function bounds(k){
  if(k==='all'){ let a=DATA.nodes; return [Math.min(...a.map(n=>n.x)),Math.min(...a.map(n=>n.y)),Math.max(...a.map(n=>n.x)),Math.max(...a.map(n=>n.y))]; }
  const s=selSet(k), a=DATA.nodes.filter(n=>s.has(n.s));
  return [Math.min(...a.map(n=>n.x)),Math.min(...a.map(n=>n.y)),Math.max(...a.map(n=>n.x)),Math.max(...a.map(n=>n.y))];
}
function fit(mode){
  const b=bounds(mode==='full'?'all':cur), pad=220;
  const w=cv.width/dpr, h=cv.height/dpr;
  const sx=w/(b[2]-b[0]+pad*2), sy=h/(b[3]-b[1]+pad*2);
  scale=Math.min(sx,sy);
  ox=(w-(b[0]+b[2])*scale)/2; oy=(h-(b[1]+b[3])*scale)/2;
  draw();
}
const P=n=>[n.x*scale+ox, n.y*scale+oy];
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#0d1117'; ctx.fillRect(0,0,cv.width,cv.height);
  // 边
  ctx.lineWidth=Math.max(1.0, 10*scale);
  for(const [i,j] of DATA.edges){
    const a=DATA.nodes[i], b=DATA.nodes[j];
    const s1=SEL.has(a.s), s2=SEL.has(b.s);
    ctx.strokeStyle = (s1&&s2) ? 'rgba(240,190,90,.95)' : 'rgba(57,66,79,.35)';
    const p=P(a), q=P(b);
    ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(q[0],q[1]); ctx.stroke();
  }
  // 节点
  for(const n of DATA.nodes){
    const on=SEL.has(n.s);
    const r = (n.t?3.2:1.5) * Math.max(1.5, Math.min(9, scale*90));
    const p=P(n);
    if(p[0]<-40||p[1]<-40||p[0]>cv.width+40||p[1]>cv.height+40) continue;
    ctx.beginPath(); ctx.arc(p[0],p[1], on? r*1.15 : r*0.62, 0, 6.2832);
    ctx.fillStyle = on ? (n.a?'#4ec9d0':'#f0be5a') : 'rgba(57,66,79,.5)';
    ctx.fill();
    if(on){ ctx.lineWidth=1.4; ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.stroke(); }
  }
  document.getElementById('info').textContent = '当前：' + ({lv:'练级BD',d1:'第一天',d2:'作者原版'}[cur]) + ' · 已点 ' + SEL.size + ' 个节点 · 缩放 ' + scale.toFixed(3);
}
// 交互
let down=false, lx=0, ly=0;
wrap.addEventListener('mousedown',e=>{down=true;lx=e.clientX;ly=e.clientY;wrap.classList.add('drag')});
window.addEventListener('mouseup',()=>{down=false;wrap.classList.remove('drag')});
window.addEventListener('mousemove',e=>{
  if(down){ ox+=e.clientX-lx; oy+=e.clientY-ly; lx=e.clientX; ly=e.clientY; draw(); return; }
  const rect=cv.getBoundingClientRect(), mx=e.clientX-rect.left, my=e.clientY-rect.top;
  let best=null, bd=14*14;
  for(const n of DATA.nodes){ const p=P(n); const d=(p[0]-mx)**2+(p[1]-my)**2; if(d<bd){bd=d;best=n;} }
  if(best){ tip.style.display='block'; tip.style.left=(mx+14)+'px'; tip.style.top=(my+14)+'px';
    tip.innerHTML = '<b>'+best.n+'</b><br><span style="color:#9aa7b4">'+best.s+'</span><br>'+best.st+(SEL.has(best.s)?'<br><span style="color:#d4a24c">✅ 已点</span>':'');
  } else tip.style.display='none';
});
wrap.addEventListener('wheel',e=>{ e.preventDefault(); const f=e.deltaY<0?1.12:1/1.12; scale*=f; ox*=f; oy*=f; draw(); },{passive:false});
document.querySelectorAll('button[data-s]').forEach(b=>b.addEventListener('click',()=>{

document.querySelector('button[data-s="lv"]').classList.add('on');
document.getElementById('list').onclick=function(){

    .map(function(n){ return '<div style="padding:4px 0;border-bottom:1px solid #223">'+

  p.innerHTML='<div style="color:#d4a24c;font-weight:600;margin-bottom:6px">已点节点 '+SEL.size+' 个（★ 是大点，数字是游戏数值ID）</div>'+rows.join('');
  p.style.display='block';
};
window.addEventListener('resize',resize);
